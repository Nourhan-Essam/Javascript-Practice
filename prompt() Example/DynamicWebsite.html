<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Website Greeting</title>
  </head>
  <body>
    <h2>Test Page</h2>
    <script>
      let username = prompt("What's your name!");
      if (username) {
        document.body.innerHTML = `<h2>Happy New Year &#127882; &#128165;, ${username}!<h2>\n We wish you a new beginning filled with success and achievements!&#9786;`;
      } else {
        document.body.innerHTML = "<h2>>Happy New Year &#127882; &#128165;!!<h2>";
      }
    </script>
  </body>
</html>
